function decode64(s){
  const d=atob(s);
  const arr=new Uint8Array(d.length);
  for(let i=0;i<d.length;i++) arr[i]=d.charCodeAt(i);
  return arr;
}

function xorData(data,key){
  const out=new Uint8Array(data.length);
  for(let i=0;i<data.length;i++) out[i]=data[i]^key[i%key.length];
  return out;
}

try{
  const joined=PARTS.join("");
  const decoded=decode64(joined);
  const plain=xorData(decoded,KEY);
  const html=new TextDecoder("utf-8").decode(plain);

  document.open();
  document.write(html);
  document.close();
}catch(e){
  console.error(e);
  document.body.innerHTML="<div style='font-family:Arial;padding:20px'>Error cargando contenido protegido.</div>";
}
